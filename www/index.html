<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f1c26" />
<title>5초 유물 발굴 & 박물관 타이쿤</title>
<style>
  :root {
    --bg-dark: #131118;
    --panel: #1e1b26;
    --panel-light: #2a2636;
    --accent: #f5b942;
    --accent-blue: #38bdf8;
    --accent-red: #f87171;
    --accent-green: #4ade80;
    --text-main: #f4f1ea;
    --text-sub: #a39eb0;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0a0e;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #322d3d;
    gap: 8px;
    flex-shrink: 0;
  }

  .stat-box { display: flex; flex-direction: column; }
  .stat-label { font-size: 11px; color: var(--text-sub); }
  .stat-val { font-size: 18px; font-weight: 800; color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .passive-badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent-blue);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }

  .btn-reset {
    background: #2b2735;
    color: #a39eb0;
    border: 1px solid #3d374a;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    touch-action: pan-y;
  }

  .tab-view { display: none; }
  .tab-view.active { display: block; padding-bottom: 24px; }

  #tab-dig.active {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-bottom: 0;
  }

  .dig-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 6px;
  }

  .stage-pill {
    background: var(--panel-light);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
  }

  .stage-pill span { color: var(--accent); }

  .relic-target-info {
    font-size: 11px;
    color: var(--text-sub);
    background: #1a1722;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #2e2938;
    text-align: right;
  }

  .timer-box {
    background: var(--panel);
    border: 1px solid #332e40;
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }

  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .timer-label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
  .timer-val { font-size: 18px; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; }
  .timer-val.urgent { color: var(--accent-red); animation: pulse 0.4s infinite alternate; }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  .timer-bar-bg {
    width: 100%;
    height: 10px;
    background: #141218;
    border-radius: 99px;
    overflow: hidden;
  }

  .timer-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4ade80, #facc15);
    transition: width 0.05s linear;
  }

  .board-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }

  .dig-board {
    position: relative;
    width: 100%;
    max-width: 350px;
    aspect-ratio: 1 / 1;
    background: #18151f;
    border: 3px solid #353042;
    border-radius: 18px;
    padding: 8px;
    display: grid;
    gap: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }

  .relic-layer {
    position: absolute;
    inset: 8px;
    display: grid;
    gap: 6px;
    pointer-events: none;
    z-index: 1;
  }

  .relic-item-box {
    background: rgba(25, 22, 34, 0.55);
    border: 1.5px solid rgba(120, 110, 145, 0.25);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .relic-item-box.found {
    background: radial-gradient(circle, rgba(250,204,21,0.45) 0%, rgba(245,158,11,0.2) 100%);
    border: 2px solid #fde047;
    box-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
    animation: foundPop 0.35s ease-out;
  }

  @keyframes foundPop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .relic-size-badge {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 10px;
    font-weight: 800;
    background: rgba(0,0,0,0.65);
    color: #fde047;
    padding: 1px 5px;
    border-radius: 5px;
  }

  .tile-layer {
    position: relative;
    z-index: 2;
    display: grid;
    gap: 6px;
    width: 100%;
    height: 100%;
  }

  .rock-tile {
    background: linear-gradient(145deg, #5a4d43, #3c332c);
    border: 2px solid #726256;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.06s ease, opacity 0.15s ease;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35);
    touch-action: manipulation;
  }

  .rock-tile:active { transform: scale(0.92); }

  .rock-tile.damaged-1 {
    background: linear-gradient(145deg, #4b4038, #332b25);
    border-style: dashed;
  }

  .rock-tile.damaged-2 {
    background: linear-gradient(145deg, #3c332d, #26201c);
    border-style: dotted;
  }

  /* 힌트 업그레이드로 감지된 칸 표시 */
  .rock-tile.hint-detected {
    border-color: #38bdf8;
    background: linear-gradient(145deg, #314459, #212e3d);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
  }

  .rock-tile.broken {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.7);
  }

  .tile-hp {
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.4);
    padding: 2px 7px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }

  .dig-footer-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 10px;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .section-title {
    font-size: 15px;
    font-weight: 800;
    margin: 0 0 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .trait-card {
    background: var(--panel);
    border: 1px solid #322d3d;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .trait-info h4 {
    margin: 0 0 4px 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trait-lv {
    font-size: 11px;
    background: rgba(245, 185, 66, 0.18);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 6px;
  }

  .trait-info p {
    margin: 0;
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.4;
  }

  .btn-buy {
    background: var(--accent);
    color: #16131c;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 800;
    font-size: 12px;
    min-width: 96px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .btn-buy:disabled {
    background: #332e40;
    color: #777185;
    cursor: not-allowed;
  }

  .museum-top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 11px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #322d3d;
  }

  .btn-auto-equip {
    background: rgba(56, 189, 248, 0.2);
    color: var(--accent-blue);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .hall-card {
    background: var(--panel);
    border: 1px solid #353042;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .hall-card.locked {
    background: #17141f;
    border-style: dashed;
    text-align: center;
    padding: 16px 12px;
  }

  .hall-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
  }

  .hall-name { font-weight: 800; font-size: 14px; }
  .hall-income { font-size: 12px; color: var(--accent-blue); font-weight: 700; }

  .hall-sub-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17141e;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
    font-size: 12px;
  }

  .btn-hall-up {
    background: rgba(245, 185, 66, 0.18);
    color: var(--accent);
    border: 1px solid rgba(245, 185, 66, 0.45);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }

  .btn-hall-up:disabled {
    background: #282433;
    color: #777185;
    border-color: #363144;
    cursor: not-allowed;
  }

  .display-slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .display-slot {
    background: #141218;
    border: 1.5px dashed #3d374d;
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .display-slot.filled {
    border-style: solid;
    border-color: #5b5173;
    background: #231f2e;
  }

  .slot-emoji { font-size: 24px; }
  .slot-name { font-size: 10px; color: var(--text-main); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .slot-rate { font-size: 10px; color: var(--accent); font-weight: 700; }

  .inv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }

  .inv-item {
    background: var(--panel);
    border: 1px solid #322d3d;
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }

  .inv-item.equipped {
    border-color: var(--accent-green);
    background: rgba(74, 222, 128, 0.08);
  }

  nav {
    display: flex;
    background: var(--panel);
    border-top: 1px solid #322d3d;
    flex-shrink: 0;
  }

  nav button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-sub);
    padding: 13px 0;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  nav button.active {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 18px;
    z-index: 60;
  }

  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--panel);
    border: 1px solid #484059;
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    max-width: 350px;
    max-height: 80dvh;
    overflow-y: auto;
    text-align: center;
  }

  .settle-list {
    background: #141218;
    border-radius: 12px;
    padding: 10px;
    margin: 12px 0;
    text-align: left;
  }

  .settle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #252130;
    font-size: 13px;
  }

  .settle-row:last-child { border-bottom: none; }

  .modal-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #16131c;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-btn.secondary {
    background: #2e293b;
    color: var(--text-main);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat-box">
      <span class="stat-label">보유 골드</span>
      <span class="stat-val" id="goldDisplay">0 G</span>
    </div>
    <div class="header-right">
      <div class="passive-badge" id="incomeDisplay">박물관 +0 G/초</div>
      <button type="button" class="btn-reset" id="resetBtn">초기화</button>
    </div>
  </header>

  <main id="mainScroll">
    <section id="tab-dig" class="tab-view active">
      <div class="dig-top-bar">
        <div class="stage-pill">STAGE <span id="stageNumText">1</span> (<span id="gridSizeText">3×3</span>)</div>
        <div class="relic-target-info" id="targetRelicHint">매장 유물: 1개</div>
      </div>

      <div class="timer-box">
        <div class="timer-row">
          <span class="timer-label" id="timerStatusText">블록을 두드리면 타이머가 시작됩니다!</span>
          <span class="timer-val" id="timerText">5.0초</span>
        </div>
        <div class="timer-bar-bg">
          <div class="timer-bar-fill" id="timerFill"></div>
        </div>
      </div>

      <div class="board-container">
        <div class="dig-board" id="digBoard">
          <div class="relic-layer" id="relicLayer"></div>
          <div class="tile-layer" id="tileLayer"></div>
        </div>
      </div>

      <div class="dig-footer-hint" id="digSubHint">
        벽 내구도 3 · 스테이지는 박물관 업그레이드로 상승 · 유물 위치는 힌트 특성으로 확인하세요!
      </div>
    </section>

    <section id="tab-traits" class="tab-view">
      <h3 class="section-title">⚡ 발굴 & 감정 특성 강화</h3>
      <div id="traitsContainer"></div>
    </section>

    <section id="tab-museum" class="tab-view">
      <div class="museum-top-actions">
        <div>
          <div style="font-size:13px; font-weight:800;">🏛️ 박물관 전시실 & 스테이지 해금</div>
          <div style="font-size:11px; color:#a39eb0;">전시실 확장·업그레이드 시 발굴 스테이지가 올라갑니다</div>
        </div>
        <button type="button" class="btn-auto-equip" id="autoEquipBtn">최고 수익 자동배치</button>
      </div>

      <div id="hallsContainer"></div>

      <h3 class="section-title" style="margin-top:16px;">
        <span>🎒 발굴한 유물 보관함</span>
        <span style="font-size:12px; color:#a39eb0;" id="invCountText">0종 보유</span>
      </h3>
      <div class="inv-grid" id="inventoryContainer"></div>
    </section>
  </main>

  <nav id="bottomNav">
    <button type="button" class="active" data-target="tab-dig">⛏️ 유물 발굴</button>
    <button type="button" data-target="tab-traits">⚡ 특성 강화</button>
    <button type="button" data-target="tab-museum">🏛️ 박물관</button>
  </nav>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalContent"></div>
  </div>
</div>

<script>
const RELIC_DB = [
  // 1칸 유물 (스테이지 1부터)
  { id: 'r1_coin', name: '고대 엽전', emoji: '🪙', w: 1, h: 1, basePrice: 120, income: 3, minStage: 1 },
  { id: 'r1_pot', name: '청자 찻잔', emoji: '🍵', w: 1, h: 1, basePrice: 160, income: 4, minStage: 1 },
  { id: 'r1_ring', name: '루비 반지', emoji: '💍', w: 1, h: 1, basePrice: 230, income: 6, minStage: 1 },
  { id: 'r1_can', name: '찌그러진 캔(가품)', emoji: '🥫', w: 1, h: 1, basePrice: 45, income: 1, minStage: 1 },

  // 2칸 유물 (스테이지 1~2부터)
  { id: 'r2_sword', name: '청동 단검', emoji: '🗡️', w: 2, h: 1, basePrice: 380, income: 11, minStage: 1 },
  { id: 'r2_scroll', name: '황금 두루마리', emoji: '📜', w: 1, h: 2, basePrice: 450, income: 14, minStage: 2 },
  { id: 'r2_harp', name: '고대 수금', emoji: '🪕', w: 2, h: 1, basePrice: 560, income: 18, minStage: 2 },

  // 4칸 대형 유물 (스테이지 3 이상부터 등장)
  { id: 'r4_crown', name: '신라 황금관', emoji: '👑', w: 2, h: 2, basePrice: 1350, income: 45, minStage: 3 },
  { id: 'r4_statue', name: '파라오 황금상', emoji: '🗿', w: 2, h: 2, basePrice: 1800, income: 62, minStage: 4 },
  { id: 'r4_dragon', name: '전설의 옥새함', emoji: '🐉', w: 2, h: 2, basePrice: 2500, income: 88, minStage: 5 }
];

const HALL_UNLOCK_COSTS = [0, 900, 3200, 9500, 25000];
const HALL_UPGRADE_BASE_COST = 600;
const STORAGE_KEY = 'dig5sec_tycoon_v3';

let state = {
  gold: 0,
  stage: 1, // 박물관 업그레이드/확장 누적 횟수에 연동 (1부터 시작)
  traits: {
    time: 0,      // +0.5초
    power: 0,     // +0.1씩 증가 (기본 1.0)
    hint: 0,      // 시작 시 유물 칸 감지 표시 개수
    price: 0,     // +10%
    luck: 0       // 대형 유물 출현율 증가
  },
  inventory: {},
  halls: [
    { level: 1, slots: [null, null, null, null] } // 제1전시실 기본 오픈 (4칸)
  ],
  lastSaveTime: Date.now()
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = {
        ...state,
        ...parsed,
        traits: { ...state.traits, ...(parsed.traits || {}) },
        halls: Array.isArray(parsed.halls) && parsed.halls.length > 0
          ? parsed.halls
          : [{ level: 1, slots: [null, null, null, null] }]
      };
    }
  } catch (e) {}
}

function saveState() {
  state.lastSaveTime = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let audioCtx = null;
function playTone(freq, type = 'triangle', duration = 0.07, vol = 0.06) {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    if (!audioCtx) audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function vibrateDevice(pattern) {
  try {
    if (navigator && typeof navigator.vibrate === 'function') {
      navigator.vibrate(pattern);
    }
  } catch (e) {}
}

function getTapPower() {
  return Number((1.0 + state.traits.power * 0.1).toFixed(1));
}

function getMaxDigTime() {
  return Number((5.0 + state.traits.time * 0.5).toFixed(1));
}

function getPriceMultiplier() {
  return 1 + state.traits.price * 0.10;
}

function getHallUpgradeCost(hall) {
  return Math.round(HALL_UPGRADE_BASE_COST * Math.pow(1.75, hall.level - 1));
}

function getHallIncome(hall) {
  let sum = 0;
  let filledCount = 0;
  hall.slots.forEach(rid => {
    if (rid) {
      const item = RELIC_DB.find(r => r.id === rid);
      if (item) {
        sum += item.income;
        filledCount++;
      }
    }
  });
  const levelMult = 1 + (hall.level - 1) * 0.25;
  let total = sum * levelMult;
  if (filledCount === 4) total *= 1.25;
  return Math.round(total);
}

function getTotalPassiveIncome() {
  return state.halls.reduce((acc, hall) => acc + getHallIncome(hall), 0);
}

// 박물관 레벨/전시실 수에 따라 현재 해금된 스테이지 계산
function recalculateStageFromMuseum() {
  const hallBonus = (state.halls.length - 1) * 2;
  const levelBonus = state.halls.reduce((sum, h) => sum + Math.max(0, h.level - 1), 0);
  state.stage = 1 + hallBonus + levelBonus;
}

let gridCols = 3;
let tiles = [];
let placedRelics = [];
let timeLeft = 5.0;
let timerRunning = false;
let roundEnded = false;
let timerInterval = null;
let lastTapStamp = 0;

function getGridSizeForStage(st) {
  if (st >= 6) return 5;
  if (st >= 3) return 4;
  return 3;
}

function setupStage() {
  clearInterval(timerInterval);
  timerRunning = false;
  roundEnded = false;
  recalculateStageFromMuseum();
  timeLeft = getMaxDigTime();

  gridCols = getGridSizeForStage(state.stage);
  const blockHp = 3.0; // 요청대로 벽은 3번 쳐야 깨지도록 기본 내구도 3

  tiles = [];
  for (let r = 0; r < gridCols; r++) {
    for (let c = 0; c < gridCols; c++) {
      tiles.push({ r, c, hp: blockHp, maxHp: blockHp, relicIdx: -1, isHint: false });
    }
  }

  const targetCount = gridCols === 3 ? 1 : (gridCols === 4 ? 2 : 3);
  placedRelics = [];

  for (let i = 0; i < targetCount; i++) {
    const relic = chooseRelicForStage(state.stage);
    const placed = tryPlaceRelic(relic, placedRelics.length);
    if (!placed) {
      const fallback = RELIC_DB.filter(r => r.w === 1 && r.h === 1)[Math.floor(Math.random() * 4)];
      tryPlaceRelic(fallback, placedRelics.length);
    }
  }

  // 힌트 특성이 있을 때만 유물이 묻힌 칸 중 일부를 감지 표시
  if (state.traits.hint > 0) {
    const relicTiles = tiles.filter(t => t.relicIdx !== -1);
    shuffleArray(relicTiles);
    const hintCount = Math.min(state.traits.hint, relicTiles.length);
    for (let i = 0; i < hintCount; i++) {
      relicTiles[i].isHint = true;
    }
  }

  document.getElementById('stageNumText').textContent = state.stage;
  document.getElementById('gridSizeText').textContent = `${gridCols}×${gridCols}`;
  document.getElementById('targetRelicHint').textContent = `유물 ${placedRelics.length}개 · 타격력 ${getTapPower().toFixed(1)}`;
  document.getElementById('timerStatusText').textContent = '블록을 두드리면 타이머가 시작됩니다!';
  updateTimerUI();
  renderBoard();
}

function chooseRelicForStage(st) {
  const candidates = RELIC_DB.filter(r => r.minStage <= st);
  const luckBonus = state.traits.luck * 0.12;
  const weighted = candidates.map(r => {
    const size = r.w * r.h;
    let weight = size === 1 ? 10 : (size === 2 ? 5 * (1 + luckBonus) : 4 * (1 + luckBonus * 1.4));
    if (r.id === 'r1_can') weight = Math.max(1.5, 4 - state.traits.luck * 0.3);
    return { item: r, weight };
  });
  const totalW = weighted.reduce((s, x) => s + x.weight, 0);
  let pick = Math.random() * totalW;
  for (const w of weighted) {
    pick -= w.weight;
    if (pick <= 0) return w.item;
  }
  return candidates[0];
}

function tryPlaceRelic(relic, idx) {
  const positions = [];
  for (let r = 0; r <= gridCols - relic.h; r++) {
    for (let c = 0; c <= gridCols - relic.w; c++) {
      let ok = true;
      for (let dr = 0; dr < relic.h; dr++) {
        for (let dc = 0; dc < relic.w; dc++) {
          const t = getTile(r + dr, c + dc);
          if (!t || t.relicIdx !== -1) ok = false;
        }
      }
      if (ok) positions.push({ r, c });
    }
  }
  if (positions.length === 0) return false;
  const chosen = positions[Math.floor(Math.random() * positions.length)];
  const cells = [];
  for (let dr = 0; dr < relic.h; dr++) {
    for (let dc = 0; dc < relic.w; dc++) {
      const t = getTile(chosen.r + dr, chosen.c + dc);
      t.relicIdx = idx;
      cells.push([chosen.r + dr, chosen.c + dc]);
    }
  }
  placedRelics.push({ relic, r: chosen.r, c: chosen.c, w: relic.w, h: relic.h, cells, found: false });
  return true;
}

function getTile(r, c) {
  return tiles.find(t => t.r === r && t.c === c);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startTimer() {
  if (timerRunning || roundEnded) return;
  timerRunning = true;
  document.getElementById('timerStatusText').textContent = '제한 시간 내에 유물을 캐내세요!';
  const startTime = performance.now();
  const initialLeft = timeLeft;

  timerInterval = setInterval(() => {
    const elapsed = (performance.now() - startTime) / 1000;
    timeLeft = Math.max(0, initialLeft - elapsed);
    updateTimerUI();
    if (timeLeft <= 0) {
      finishRound(false);
    }
  }, 40);
}

function updateTimerUI() {
  const maxT = getMaxDigTime();
  const pct = Math.max(0, (timeLeft / maxT) * 100);
  const tEl = document.getElementById('timerText');
  tEl.textContent = `${timeLeft.toFixed(1)}초`;
  if (timeLeft <= 1.8 && timerRunning) tEl.classList.add('urgent');
  else tEl.classList.remove('urgent');
  document.getElementById('timerFill').style.width = `${pct}%`;
}

function onTapTile(r, c) {
  const now = performance.now();
  if (now - lastTapStamp < 45) return;
  lastTapStamp = now;

  if (roundEnded) return;
  if (!timerRunning) startTimer();

  const tile = getTile(r, c);
  if (!tile || tile.hp <= 0) return;

  tile.hp = Number(Math.max(0, tile.hp - getTapPower()).toFixed(2));
  vibrateDevice(tile.hp === 0 ? 18 : 8);

  if (tile.hp === 0) {
    playTone(tile.relicIdx !== -1 ? 520 : 240, 'triangle', 0.08, 0.07);
    checkRelicCompletion();
  } else {
    playTone(tile.relicIdx !== -1 ? 340 : 170, 'square', 0.05, 0.04);
  }

  renderBoard();

  if (placedRelics.length > 0 && placedRelics.every(pr => pr.found)) {
    setTimeout(() => finishRound(true), 280);
  }
}

function checkRelicCompletion() {
  placedRelics.forEach(pr => {
    if (pr.found) return;
    const allBroken = pr.cells.every(([cr, cc]) => getTile(cr, cc).hp <= 0);
    if (allBroken) {
      pr.found = true;
      playTone(780, 'sine', 0.18, 0.09);
      vibrateDevice([25, 30, 45]);
    }
  });
}

function finishRound(allCleared) {
  if (roundEnded) return;
  roundEnded = true;
  clearInterval(timerInterval);
  timerRunning = false;

  const foundList = placedRelics.filter(pr => pr.found);
  const priceMult = getPriceMultiplier();
  let totalGold = 0;

  foundList.forEach(pr => {
    const earned = Math.round(pr.relic.basePrice * priceMult);
    totalGold += earned;
    state.inventory[pr.relic.id] = (state.inventory[pr.relic.id] || 0) + 1;
  });

  state.gold += totalGold;
  saveState();
  updateHeaderUI();
  renderTraits();
  renderMuseum();

  const modal = document.getElementById('modalContent');
  const bonusPct = Math.round((priceMult - 1) * 100);
  modal.innerHTML = `
    <div style="font-size:12px; color:#a39eb0;">STAGE ${state.stage} ${allCleared ? '발굴 완료!' : '시간 종료!'}</div>
    <h3 style="margin:6px 0 4px 0; font-size:20px;">⛏️ 유물 발굴 정산</h3>
    <div style="font-size:12px; color:#38bdf8;">감정가 보너스 +${bonusPct}% 적용</div>

    <div class="settle-list">
      ${foundList.length > 0 ? foundList.map(pr => {
        const val = Math.round(pr.relic.basePrice * priceMult);
        return `
          <div class="settle-row">
            <span>${pr.relic.emoji} <strong>${pr.relic.name}</strong> (${pr.w * pr.h}칸)</span>
            <span style="color:#fbbf24; font-weight:800;">+${val.toLocaleString()} G</span>
          </div>
        `;
      }).join('') : `<div style="text-align:center; padding:12px; color:#a39eb0; font-size:13px;">시간 내에 완전히 파낸 유물이 없습니다.<br>특성 강화나 다음 판에 도전해보세요!</div>`}
    </div>

    <div style="font-size:16px; font-weight:800; margin:10px 0;">
      총 획득 골드: <span style="color:#fbbf24;">+${totalGold.toLocaleString()} G</span>
    </div>

    <div class="modal-btn-row">
      <button type="button" class="modal-btn secondary" id="btnGoMuseum">🏛️ 박물관</button>
      <button type="button" class="modal-btn" id="btnNextStage">계속 발굴</button>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('show');

  document.getElementById('btnGoMuseum').onclick = () => {
    document.getElementById('modalOverlay').classList.remove('show');
    switchTab('tab-museum');
    setupStage();
  };

  document.getElementById('btnNextStage').onclick = () => {
    document.getElementById('modalOverlay').classList.remove('show');
    setupStage();
  };
}

function renderBoard() {
  const relicLayer = document.getElementById('relicLayer');
  const tileLayer = document.getElementById('tileLayer');

  relicLayer.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  relicLayer.style.gridTemplateRows = `repeat(${gridCols}, 1fr)`;
  tileLayer.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
  tileLayer.style.gridTemplateRows = `repeat(${gridCols}, 1fr)`;

  // 유물은 힌트 레벨이 있거나 이미 찾은 경우에만 보이게 처리(기본은 숨김)
  relicLayer.innerHTML = '';
  placedRelics.forEach(pr => {
    const hasHintForRelic = pr.cells.some(([cr, cc]) => {
      const t = getTile(cr, cc);
      return t && t.isHint;
    });
    const showRelic = pr.found || hasHintForRelic;

    const div = document.createElement('div');
    div.className = `relic-item-box ${pr.found ? 'found' : ''}`;
    div.style.gridColumn = `${pr.c + 1} / span ${pr.w}`;
    div.style.gridRow = `${pr.r + 1} / span ${pr.h}`;
    const size = pr.w * pr.h;
    const emojiSize = size === 4 ? '52px' : (size === 2 ? '36px' : '28px');

    if (showRelic) {
      div.innerHTML = `
        <span class="relic-size-badge">${size}칸</span>
        <span style="font-size:${emojiSize};">${pr.relic.emoji}</span>
      `;
    } else {
      div.innerHTML = `<span class="relic-size-badge">${size}칸</span>`;
    }
    relicLayer.appendChild(div);
  });

  tileLayer.innerHTML = '';
  tiles.forEach(t => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isBroken = t.hp <= 0;
    const dmgStep = t.hp > 2 ? 0 : (t.hp > 1 ? 1 : 2);
    const dmgClass = dmgStep === 1 ? 'damaged-1' : (dmgStep === 2 ? 'damaged-2' : '');
    const hintClass = t.isHint && !isBroken ? 'hint-detected' : '';

    btn.className = `rock-tile ${isBroken ? 'broken' : ''} ${dmgClass} ${hintClass}`;
    if (!isBroken) {
      const hpText = Number.isInteger(t.hp) ? t.hp : t.hp.toFixed(1);
      btn.innerHTML = `<span class="tile-hp">${t.isHint ? '🔍 ' : ''}${hpText}</span>`;
      btn.addEventListener('click', () => onTapTile(t.r, t.c));
    }
    tileLayer.appendChild(btn);
  });
}

function renderTraits() {
  const container = document.getElementById('traitsContainer');
  container.innerHTML = '';

  TRAIT_DEFS.forEach(tr => {
    const lv = state.traits[tr.key] || 0;
    const isMax = lv >= tr.max;
    const cost = tr.cost(lv);

    const card = document.createElement('div');
    card.className = 'trait-card';
    card.innerHTML = `
      <div class="trait-info">
        <h4>${tr.icon} ${tr.name} <span class="trait-lv">Lv.${lv}${isMax ? ' (MAX)' : ''}</span></h4>
        <p>${tr.desc(lv)}</p>
      </div>
      <button type="button" class="btn-buy" ${isMax || state.gold < cost ? 'disabled' : ''}>
        ${isMax ? '최대 레벨' : `강화<br>${cost.toLocaleString()} G`}
      </button>
    `;

    card.querySelector('button').onclick = () => {
      if (!isMax && state.gold >= cost) {
        state.gold -= cost;
        state.traits[tr.key] = lv + 1;
        playTone(620, 'sine', 0.1, 0.07);
        saveState();
        updateHeaderUI();
        renderTraits();
        if (!timerRunning && !roundEnded) setupStage();
      }
    };

    container.appendChild(card);
  });
}

function getEquippedCount(relicId) {
  let count = 0;
  state.halls.forEach(h => h.slots.forEach(id => { if (id === relicId) count++; }));
  return count;
}

function renderMuseum() {
  recalculateStageFromMuseum();
  const hallsEl = document.getElementById('hallsContainer');
  hallsEl.innerHTML = '';

  state.halls.forEach((hall, hIdx) => {
    const hallInc = getHallIncome(hall);
    const isFull = hall.slots.every(s => s !== null);
    const upCost = getHallUpgradeCost(hall);

    const card = document.createElement('div');
    card.className = 'hall-card';
    card.innerHTML = `
      <div class="hall-header">
        <span class="hall-name">🏛️ 제${hIdx + 1}전시실 (Lv.${hall.level}) ${isFull ? '<span style="color:#4ade80; font-size:11px;">(풀세트 +25%)</span>' : ''}</span>
        <span class="hall-income">+${hallInc.toLocaleString()} G/초</span>
      </div>
      <div class="hall-sub-bar">
        <span style="color:#d4d0de;">전시실 업그레이드 → 수익 +25% & 스테이지 상승</span>
        <button type="button" class="btn-hall-up" data-hidx="${hIdx}" ${state.gold < upCost ? 'disabled' : ''}>
          업그레이드 (${upCost.toLocaleString()} G)
        </button>
      </div>
      <div class="display-slots">
        ${hall.slots.map((rid, sIdx) => {
          const item = rid ? RELIC_DB.find(r => r.id === rid) : null;
          return `
            <div class="display-slot ${item ? 'filled' : ''}" data-hall="${hIdx}" data-slot="${sIdx}">
              ${item ? `
                <span class="slot-emoji">${item.emoji}</span>
                <span class="slot-name">${item.name}</span>
                <span class="slot-rate">+${item.income} G/s</span>
              ` : `
                <span style="font-size:20px; color:#524b63;">+</span>
                <span style="font-size:10px; color:#777185;">빈 진열대</span>
              `}
            </div>
          `;
        }).join('')}
      </div>
    `;

    card.querySelector('.btn-hall-up').onclick = (e) => {
      const idx = Number(e.currentTarget.dataset.hidx);
      const targetHall = state.halls[idx];
      const cost = getHallUpgradeCost(targetHall);
      if (state.gold >= cost) {
        state.gold -= cost;
        targetHall.level += 1;
        recalculateStageFromMuseum();
        playTone(720, 'sine', 0.14, 0.08);
        saveState();
        updateHeaderUI();
        renderMuseum();
        if (!timerRunning && !roundEnded) setupStage();
      }
    };

    card.querySelectorAll('.display-slot').forEach(slotEl => {
      slotEl.onclick = () => openSlotSelectModal(Number(slotEl.dataset.hall), Number(slotEl.dataset.slot));
    });

    hallsEl.appendChild(card);
  });

  const nextHallIdx = state.halls.length;
  if (nextHallIdx < HALL_UNLOCK_COSTS.length) {
    const unlockCost = HALL_UNLOCK_COSTS[nextHallIdx];
    const lockCard = document.createElement('div');
    lockCard.className = 'hall-card locked';
    lockCard.innerHTML = `
      <div style="font-size:14px; font-weight:800; margin-bottom:4px;">🔒 제${nextHallIdx + 1}전시실 확장 (4칸 추가 & 스테이지 +2)</div>
      <div style="font-size:12px; color:#a39eb0; margin-bottom:10px;">새 전시실을 열면 유물 4칸이 늘고 발굴 스테이지가 상승합니다.</div>
      <button type="button" class="btn-buy" id="unlockHallBtn" ${state.gold < unlockCost ? 'disabled' : ''}>
        전시실 열기 (${unlockCost.toLocaleString()} G)
      </button>
    `;
    lockCard.querySelector('#unlockHallBtn').onclick = () => {
      if (state.gold >= unlockCost) {
        state.gold -= unlockCost;
        state.halls.push({ level: 1, slots: [null, null, null, null] });
        recalculateStageFromMuseum();
        playTone(680, 'sine', 0.15, 0.08);
        saveState();
        updateHeaderUI();
        renderMuseum();
        if (!timerRunning && !roundEnded) setupStage();
      }
    };
    hallsEl.appendChild(lockCard);
  }

  const invEl = document.getElementById('inventoryContainer');
  invEl.innerHTML = '';
  const ownedIds = Object.keys(state.inventory).filter(id => state.inventory[id] > 0);
  document.getElementById('invCountText').textContent = `${ownedIds.length}종 보유`;

  if (ownedIds.length === 0) {
    invEl.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:18px; color:#777185; font-size:12px;">아직 발굴한 유물이 없습니다. 발굴 탭에서 유물을 캐보세요!</div>`;
    return;
  }

  ownedIds.forEach(rid => {
    const item = RELIC_DB.find(r => r.id === rid);
    if (!item) return;
    const totalOwned = state.inventory[rid];
    const eqCount = getEquippedCount(rid);

    const div = document.createElement('div');
    div.className = `inv-item ${eqCount > 0 ? 'equipped' : ''}`;
    div.innerHTML = `
      <div style="font-size:28px;">${item.emoji}</div>
      <div style="font-size:11px; font-weight:700; margin-top:2px;">${item.name}</div>
      <div style="font-size:10px; color:#38bdf8;">+${item.income} G/초</div>
      <div style="font-size:10px; color:#a39eb0; margin-top:2px;">전시중 ${eqCount} / 보유 ${totalOwned}</div>
    `;
    invEl.appendChild(div);
  });
}

function openSlotSelectModal(hallIdx, slotIdx) {
  const currentRid = state.halls[hallIdx].slots[slotIdx];
  const available = RELIC_DB.filter(r => {
    const owned = state.inventory[r.id] || 0;
    const eq = getEquippedCount(r.id);
    return owned > eq;
  }).sort((a, b) => b.income - a.income);

  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3 style="margin:0 0 4px 0; font-size:17px;">🏛️ 제${hallIdx + 1}전시실 - ${slotIdx + 1}번 진열대</h3>
    <div style="font-size:12px; color:#a39eb0; margin-bottom:10px;">전시할 유물을 선택하세요</div>

    <div class="settle-list" style="max-height:240px; overflow-y:auto;">
      ${currentRid ? `
        <div class="settle-row" id="unequipRow" style="cursor:pointer; color:#f87171;">
          <span>❌ 현재 전시 중인 유물 회수하기</span>
        </div>
      ` : ''}
      ${available.length > 0 ? available.map(r => `
        <div class="settle-row pick-relic-row" data-rid="${r.id}" style="cursor:pointer;">
          <span>${r.emoji} <strong>${r.name}</strong></span>
          <span style="color:#38bdf8; font-weight:700;">+${r.income} G/초</span>
        </div>
      `).join('') : `<div style="text-align:center; padding:14px; font-size:12px; color:#777185;">배치 가능한 여분 유물이 없습니다.</div>`}
    </div>

    <button type="button" class="modal-btn secondary" id="closeSlotModal" style="width:100%;">닫기</button>
  `;

  document.getElementById('modalOverlay').classList.add('show');

  if (currentRid) {
    document.getElementById('unequipRow').onclick = () => {
      state.halls[hallIdx].slots[slotIdx] = null;
      saveState();
      updateHeaderUI();
      renderMuseum();
      document.getElementById('modalOverlay').classList.remove('show');
    };
  }

  modal.querySelectorAll('.pick-relic-row').forEach(row => {
    row.onclick = () => {
      state.halls[hallIdx].slots[slotIdx] = row.dataset.rid;
      playTone(540, 'sine', 0.08, 0.06);
      saveState();
      updateHeaderUI();
      renderMuseum();
      document.getElementById('modalOverlay').classList.remove('show');
    };
  });

  document.getElementById('closeSlotModal').onclick = () => {
    document.getElementById('modalOverlay').classList.remove('show');
  };
}

document.getElementById('autoEquipBtn').onclick = () => {
  const pool = [];
  Object.keys(state.inventory).forEach(rid => {
    const item = RELIC_DB.find(r => r.id === rid);
    const cnt = state.inventory[rid] || 0;
    if (item && cnt > 0) {
      for (let i = 0; i < cnt; i++) pool.push(item);
    }
  });
  pool.sort((a, b) => b.income - a.income);

  let idx = 0;
  for (let h = 0; h < state.halls.length; h++) {
    for (let s = 0; s < 4; s++) {
      state.halls[h].slots[s] = idx < pool.length ? pool[idx++].id : null;
    }
  }
  playTone(660, 'sine', 0.12, 0.07);
  saveState();
  updateHeaderUI();
  renderMuseum();
};

function updateHeaderUI() {
  document.getElementById('goldDisplay').textContent = `${Math.floor(state.gold).toLocaleString()} G`;
  document.getElementById('incomeDisplay').textContent = `박물관 +${getTotalPassiveIncome().toLocaleString()} G/초`;
}

function switchTab(targetId) {
  document.querySelectorAll('#bottomNav button').forEach(b => {
    b.classList.toggle('active', b.dataset.target === targetId);
  });
  document.querySelectorAll('.tab-view').forEach(v => {
    v.classList.toggle('active', v.id === targetId);
  });
  document.getElementById('mainScroll').scrollTop = 0;
  if (targetId === 'tab-traits') renderTraits();
  if (targetId === 'tab-museum') renderMuseum();
}

document.getElementById('bottomNav').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-target]');
  if (btn) {
    switchTab(btn.dataset.target);
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 진행 데이터와 골드를 초기화할까요?')) {
    localStorage.removeItem(STORAGE_KEY);
    state = {
      gold: 0,
      stage: 1,
      traits: { time: 0, power: 0, hint: 0, price: 0, luck: 0 },
      inventory: {},
      halls: [{ level: 1, slots: [null, null, null, null] }],
      lastSaveTime: Date.now()
    };
    saveState();
    updateHeaderUI();
    renderTraits();
    renderMuseum();
    setupStage();
  }
});

setInterval(() => {
  const inc = getTotalPassiveIncome();
  if (inc > 0) {
    state.gold += inc;
    updateHeaderUI();
    saveState();
  }
}, 1000);

loadState();
const elapsedSec = Math.min(3600 * 8, Math.floor((Date.now() - state.lastSaveTime) / 1000));
const offlineGold = elapsedSec * getTotalPassiveIncome();
if (offlineGold > 0 && elapsedSec >= 10) {
  state.gold += offlineGold;
  saveState();
  setTimeout(() => {
    const modal = document.getElementById('modalContent');
    modal.innerHTML = `
      <div style="font-size:12px; color:#a39eb0;">박물관 오프라인 정산</div>
      <div style="font-size:52px; margin:10px 0;">🏛️</div>
      <h3 style="margin:4px 0;">+${offlineGold.toLocaleString()} G 획득!</h3>
      <p style="font-size:13px; color:#d4d0de; margin:8px 0;">자리를 비운 ${elapsedSec}초 동안 관람객 입장료가 쌓였습니다.</p>
      <button type="button" class="modal-btn" id="closeOfflineBtn" style="width:100%;">확인</button>
    `;
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('closeOfflineBtn').onclick = () => {
      document.getElementById('modalOverlay').classList.remove('show');
    };
  }, 250);
}

updateHeaderUI();
renderTraits();
renderMuseum();
setupStage();
</script>
</body>
</html>
