<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f1c26" />
<title>유물 복원 & 박물관 타이쿤</title>
<style>
  :root {
    --bg-dark: #141218;
    --panel: #1f1c26;
    --panel-light: #2b2735;
    --accent: #f5b942;
    --text-main: #f4f1ea;
    --text-sub: #a39eb0;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0a0e;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #322d3d;
    gap: 8px;
    flex-shrink: 0;
  }

  .stat-box { display: flex; flex-direction: column; }
  .stat-label { font-size: 11px; color: var(--text-sub); }
  .stat-val { font-size: 17px; font-weight: 800; color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .passive-badge {
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }

  .btn-reset {
    background: #2b2735;
    color: #a39eb0;
    border: 1px solid #3d374a;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    touch-action: pan-y;
  }

  .tab-view {
    display: none;
  }

  #tab-workshop.active {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  #tab-museum.active {
    display: block;
    padding-bottom: 24px;
    touch-action: pan-y;
  }

  .stage-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage-badge {
    background: var(--panel-light);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
  }

  .grade-tag {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    background: #2a2633;
    color: #d4d0de;
  }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 52dvh;
    margin: 0 auto;
    background: radial-gradient(circle at center, #282333 0%, #16131c 100%);
    border-radius: 20px;
    border: 2px solid #332e40;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.65);
    touch-action: none;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  .progress-wrap { margin-top: 12px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    width: 100%;
    height: 13px;
    background: #262230;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f59e0b, #fde047);
    transition: width 0.08s ease-out;
  }

  .upgrade-card {
    margin-top: auto;
    background: var(--panel);
    border: 1px solid #353042;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tool-info h4 {
    margin: 0 0 4px 0;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tool-info p {
    margin: 0;
    font-size: 12px;
    color: var(--text-sub);
  }

  .btn-upgrade {
    background: var(--accent);
    color: #18141c;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    min-width: 110px;
  }

  .btn-upgrade:disabled {
    background: #363142;
    color: #777185;
  }

  .museum-summary {
    background: var(--panel);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .theme-section {
    background: var(--panel);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #2e2938;
  }

  .theme-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .theme-title { font-weight: 700; font-size: 14px; }
  .theme-bonus {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #2b2735;
    color: var(--text-sub);
  }
  .theme-bonus.unlocked {
    background: rgba(245, 185, 66, 0.2);
    color: var(--accent);
    font-weight: 700;
  }

  .relic-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .relic-slot {
    background: #17141d;
    border: 1px solid #2d2838;
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .relic-slot.owned {
    border-color: #4b435c;
    background: #231f2d;
  }

  .relic-emoji { font-size: 28px; filter: grayscale(1) brightness(0.25); }
  .relic-slot.owned .relic-emoji { filter: none; }
  .relic-name { font-size: 11px; font-weight: 600; color: var(--text-sub); }
  .relic-slot.owned .relic-name { color: var(--text-main); }
  .relic-income { font-size: 10px; color: #38bdf8; }

  nav {
    display: flex;
    background: var(--panel);
    border-top: 1px solid #322d3d;
    flex-shrink: 0;
  }

  nav button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-sub);
    padding: 14px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  nav button.active {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--panel);
    border: 1px solid #443d54;
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .modal-emoji { font-size: 56px; margin: 10px 0; }
  .modal-btn {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #18141c;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat-box">
      <span class="stat-label">보유 골드</span>
      <span class="stat-val" id="goldDisplay">0 G</span>
    </div>
    <div class="header-right">
      <div class="passive-badge" id="incomeDisplay">박물관 +0 G/초</div>
      <button class="btn-reset" id="resetBtn">초기화</button>
    </div>
  </header>

  <main id="mainScroll">
    <section id="tab-workshop" class="tab-view active">
      <div class="stage-header">
        <span class="stage-badge" id="stageText">STAGE 1 (내구도 Lv.1)</span>
        <span class="grade-tag" id="gradeText">❓ 미확인 흙덩어리</span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="380" height="380"></canvas>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span id="statusHint">손가락으로 흙덩어리를 문질러 발굴하세요!</span>
          <strong id="percentText">0%</strong>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="upgrade-card">
        <div class="tool-info">
          <h4><span id="toolIcon">🖌️</span> <span id="toolName">나무 붓 Lv.1</span></h4>
          <p id="toolDesc">연마력 22 | 범위 20px</p>
        </div>
        <button class="btn-upgrade" id="upgradeBtn">강화<br><span id="upgradeCost">250 G</span></button>
      </div>
    </section>

    <section id="tab-museum" class="tab-view">
      <div class="museum-summary">
        <span>수집: <strong id="collectedCount">0 / 12</strong></span>
        <span>복원 가속: <strong id="bonusSpeedText" style="color:#fbbf24;">+0%</strong></span>
      </div>
      <div id="museumList"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-target="tab-workshop">⛏️ 복원 작업실</button>
    <button data-target="tab-museum">🏛️ 박물관 도감</button>
  </nav>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div id="modalSubtitle" style="font-size:12px; color:#a39eb0;">감정 및 복원 완료!</div>
      <div class="modal-emoji" id="modalEmoji">👑</div>
      <h3 id="modalTitle" style="margin:4px 0;">신라 금관</h3>
      <p id="modalDesc" style="font-size:13px; color:#d4d0de; line-height:1.5; margin:8px 0;"></p>
      <button class="modal-btn" id="modalCloseBtn">확인 및 다음 발굴</button>
    </div>
  </div>
</div>

<script>
const THEMES = [
  {
    id: 'silla',
    name: '🇰🇷 신라 시대 유물 세트',
    bonusType: 'speed',
    bonusValue: 0.25,
    bonusLabel: '복원 속도 +25%',
    items: [
      { id: 'silla_1', name: '토기 주전자', emoji: '🏺', grade: 'common', baseReward: 140, income: 4 },
      { id: 'silla_2', name: '금동 반가사유상', emoji: '🧘', grade: 'rare', baseReward: 320, income: 10 },
      { id: 'silla_3', name: '천마총 금관', emoji: '👑', grade: 'legendary', baseReward: 750, income: 24 }
    ]
  },
  {
    id: 'egypt',
    name: '🇪🇬 고대 이집트 세트',
    bonusType: 'speed',
    bonusValue: 0.35,
    bonusLabel: '복원 속도 +35%',
    items: [
      { id: 'egypt_1', name: '스카라베 부적', emoji: '🪲', grade: 'common', baseReward: 165, income: 5 },
      { id: 'egypt_2', name: '아누비스 석상', emoji: '🐺', grade: 'rare', baseReward: 380, income: 12 },
      { id: 'egypt_3', name: '투탕카멘 황금가면', emoji: '🎭', grade: 'legendary', baseReward: 900, income: 30 }
    ]
  },
  {
    id: 'medieval',
    name: '⚔️ 중세 왕국 세트',
    bonusType: 'income',
    bonusValue: 0.30,
    bonusLabel: '박물관 수익 +30%',
    items: [
      { id: 'med_1', name: '청동 나침반', emoji: '🧭', grade: 'common', baseReward: 190, income: 6 },
      { id: 'med_2', name: '왕실 루비 성배', emoji: '🏆', grade: 'rare', baseReward: 440, income: 15 },
      { id: 'med_3', name: '전설의 엑스칼리버', emoji: '🗡️', grade: 'legendary', baseReward: 1100, income: 38 }
    ]
  },
  {
    id: 'fake_set',
    name: '🤡 황당한 가품 컬렉션',
    bonusType: 'speed',
    bonusValue: 0.20,
    bonusLabel: '어이없음 가속 +20%',
    items: [
      { id: 'fake_1', name: '찌그러진 콜라 캔', emoji: '🥫', grade: 'fake', baseReward: 65, income: 1 },
      { id: 'fake_2', name: '한 짝 남은 삼선슬리퍼', emoji: '🩴', grade: 'fake', baseReward: 75, income: 1 },
      { id: 'fake_3', name: '녹슨 참치캔 뚜껑', emoji: '💿', grade: 'fake', baseReward: 85, income: 2 }
    ]
  }
];

const ALL_ITEMS = THEMES.flatMap(t => t.items);
const GRADE_META = {
  common: { label: '일반 유물', color: '#9ca3af' },
  rare: { label: '희귀 유물', color: '#38bdf8' },
  legendary: { label: '전설 유물', color: '#fbbf24' },
  fake: { label: '가품 (짝퉁!)', color: '#f87171' }
};

const STORAGE_KEY = 'relic_tycoon_native_v1';
let state = {
  gold: 0,
  stage: 1,
  toolLevel: 1,
  owned: {},
  lastSaveTime: Date.now()
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch (e) {}
}

function saveState() {
  state.lastSaveTime = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let audioCtx = null;
let lastSoundTime = 0;
function playScrubSound(toolTier) {
  const now = performance.now();
  if (now - lastSoundTime < 75) return;
  lastSoundTime = now;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    if (toolTier === 1) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190 + Math.random() * 80, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    } else if (toolTier === 2) {
      osc.type = 'square';
      osc.frequency.setValueAtTime(420 + Math.random() * 160, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(860 + Math.random() * 240, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    }
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  } catch (e) {}
}

function getToolStats(lv) {
  let tier = 1, name = '나무 붓', icon = '🖌️';
  if (lv >= 8) { tier = 3; name = '정밀 레이저'; icon = '⚡'; }
  else if (lv >= 4) { tier = 2; name = '끌과 망치'; icon = '⚒️'; }

  const tierBonus = tier === 3 ? 2.4 : (tier === 2 ? 1.55 : 1.0);
  const power = Math.round(22 * Math.pow(1.42, lv - 1) * tierBonus);
  const radius = Math.min(54, 20 + (lv - 1) * 2.5 + (tier - 1) * 6);
  const cost = Math.round(250 * Math.pow(1.75, lv - 1));
  return { lv, tier, name, icon, power, radius, cost };
}

function getBonuses() {
  let speedMult = 1.0;
  let incomeMult = 1.0;
  THEMES.forEach(t => {
    const complete = t.items.every(it => (state.owned[it.id] || 0) > 0);
    if (complete) {
      if (t.bonusType === 'speed') speedMult += t.bonusValue;
      if (t.bonusType === 'income') incomeMult += t.bonusValue;
    }
  });
  return { speedMult, incomeMult };
}

function getPassiveIncomePerSec() {
  let base = 0;
  ALL_ITEMS.forEach(it => {
    const cnt = state.owned[it.id] || 0;
    if (cnt > 0) base += it.income * (1 + (cnt - 1) * 0.25);
  });
  return Math.floor(base * getBonuses().incomeMult);
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID = 36;
const CELL_SIZE = canvas.width / GRID;
let grid = [];
let maxCellHp = 100;
let currentRelic = null;
let isCompleted = false;
let isRubbing = false;
let lastPt = null;
let pointerPos = null;
let particles = [];
let shineX = -150;

function pickRandomRelic() {
  const r = Math.random();
  let pool;
  if (r < 0.20) pool = ALL_ITEMS.filter(i => i.grade === 'fake');
  else if (r < 0.65) pool = ALL_ITEMS.filter(i => i.grade === 'common');
  else if (r < 0.90) pool = ALL_ITEMS.filter(i => i.grade === 'rare');
  else pool = ALL_ITEMS.filter(i => i.grade === 'legendary');
  return pool[Math.floor(Math.random() * pool.length)];
}

function initStage() {
  currentRelic = pickRandomRelic();
  isCompleted = false;
  shineX = -150;
  maxCellHp = 85 + (state.stage - 1) * 42;
  grid = Array.from({ length: GRID }, (_, gy) =>
    Array.from({ length: GRID }, (_, gx) => {
      const dx = (gx + 0.5) * CELL_SIZE - canvas.width / 2;
      const dy = (gy + 0.5) * CELL_SIZE - canvas.height / 2;
      const dist = Math.hypot(dx, dy);
      return dist <= 155 ? maxCellHp : 0;
    })
  );
  document.getElementById('stageText').textContent = `STAGE ${state.stage} (내구도 Lv.${state.stage})`;
  document.getElementById('gradeText').textContent = '❓ 미확인 흙덩어리';
  document.getElementById('gradeText').style.color = '#d4d0de';
  document.getElementById('statusHint').textContent = '손가락으로 흙덩어리를 문질러 발굴하세요!';
  updateProgressUI();
}

function getProgressPercent() {
  let totalMax = 0, totalCur = 0;
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const dx = (x + 0.5) * CELL_SIZE - canvas.width / 2;
      const dy = (y + 0.5) * CELL_SIZE - canvas.height / 2;
      if (Math.hypot(dx, dy) <= 155) {
        totalMax += maxCellHp;
        totalCur += grid[y][x];
      }
    }
  }
  if (totalMax === 0) return 100;
  const pct = Math.floor(((totalMax - totalCur) / totalMax) * 100);
  return totalCur <= 0 ? 100 : Math.min(99, pct);
}

function scrubAt(x, y) {
  if (isCompleted) return;
  const tool = getToolStats(state.toolLevel);
  const bonus = getBonuses();
  const dmg = tool.power * bonus.speedMult * 0.38;
  let hit = false;

  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      if (grid[gy][gx] <= 0) continue;
      const cx = (gx + 0.5) * CELL_SIZE;
      const cy = (gy + 0.5) * CELL_SIZE;
      if (Math.hypot(cx - x, cy - y) <= tool.radius) {
        grid[gy][gx] = Math.max(0, grid[gy][gx] - dmg);
        hit = true;
      }
    }
  }

  if (hit) {
    playScrubSound(tool.tier);
    if (navigator.vibrate) navigator.vibrate(8);
    for (let i = 0; i < 3; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4 - 1,
        life: 1,
        color: tool.tier === 3 ? '#38bdf8' : (tool.tier === 2 ? '#fbbf24' : '#a8896c')
      });
    }
    const pct = updateProgressUI();
    if (pct >= 100) completeRelic();
  }
}

function scrubAlong(p1, p2) {
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const steps = Math.max(1, Math.ceil(dist / 8));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    scrubAt(p1.x + (p2.x - p1.x) * t, p1.y + (p2.y - p1.y) * t);
  }
}

function updateProgressUI() {
  const pct = getProgressPercent();
  document.getElementById('percentText').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = `${pct}%`;
  return pct;
}

function completeRelic() {
  if (isCompleted) return;
  isCompleted = true;
  shineX = -120;
  if (navigator.vibrate) navigator.vibrate([30, 40, 60]);

  const meta = GRADE_META[currentRelic.grade];
  const gTag = document.getElementById('gradeText');
  gTag.textContent = meta.label;
  gTag.style.color = meta.color;
  document.getElementById('statusHint').textContent = '✨ 복원 및 감정 완료!';

  const reward = Math.round(currentRelic.baseReward * (1 + (state.stage - 1) * 0.35));
  state.gold += reward;
  state.owned[currentRelic.id] = (state.owned[currentRelic.id] || 0) + 1;
  state.stage += 1;
  saveState();
  updateHeaderUI();
  renderMuseum();

  setTimeout(() => {
    document.getElementById('modalSubtitle').textContent = `[${meta.label}] 감정 결과`;
    document.getElementById('modalEmoji').textContent = currentRelic.emoji;
    document.getElementById('modalTitle').textContent = currentRelic.name;
    document.getElementById('modalDesc').innerHTML =
      `복원 보상: <strong style="color:#fbbf24;">+${reward.toLocaleString()} G</strong><br>` +
      `박물관 전시 수익: <strong style="color:#38bdf8;">+${currentRelic.income} G/초</strong>`;
    document.getElementById('modalOverlay').classList.add('show');
  }, 480);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createRadialGradient(190, 190, 20, 190, 190, 165);
  grad.addColorStop(0, 'rgba(245, 185, 66, 0.16)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.font = '165px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(currentRelic.emoji, 190, 198);
  ctx.restore();

  if (isCompleted && shineX < 520) {
    shineX += 14;
    ctx.save();
    ctx.beginPath();
    ctx.arc(190, 190, 155, 0, Math.PI * 2);
    ctx.clip();
    const sGrad = ctx.createLinearGradient(shineX - 50, 0, shineX + 50, 380);
    sGrad.addColorStop(0, 'rgba(255,255,255,0)');
    sGrad.addColorStop(0.5, 'rgba(255,255,255,0.55)');
    sGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sGrad;
    ctx.fillRect(0, 0, 380, 380);
    ctx.restore();
  }

  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const hp = grid[y][x];
      if (hp <= 0) continue;
      const ratio = hp / maxCellHp;
      ctx.fillStyle = ratio > 0.65 ? '#5c4433' : (ratio > 0.3 ? '#785a43' : 'rgba(156, 122, 94, 0.65)');
      ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE + 0.6, CELL_SIZE + 0.6);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.06;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (pointerPos && !isCompleted) {
    const tool = getToolStats(state.toolLevel);
    ctx.save();
    ctx.beginPath();
    ctx.arc(pointerPos.x, pointerPos.y, tool.radius, 0, Math.PI * 2);
    ctx.strokeStyle = tool.tier === 3 ? '#38bdf8' : (tool.tier === 2 ? '#fbbf24' : '#f4f1ea');
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '24px serif';
    ctx.fillText(tool.icon, pointerPos.x + 12, pointerPos.y - 12);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  isRubbing = true;
  const pt = getCanvasPos(e);
  lastPt = pt;
  pointerPos = pt;
  scrubAt(pt.x, pt.y);
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  const pt = getCanvasPos(e);
  pointerPos = pt;
  if (!isRubbing) return;
  if (lastPt) scrubAlong(lastPt, pt);
  else scrubAt(pt.x, pt.y);
  lastPt = pt;
});

canvas.addEventListener('pointerup', () => { isRubbing = false; lastPt = null; });
canvas.addEventListener('pointercancel', () => { isRubbing = false; lastPt = null; });

function updateHeaderUI() {
  const tool = getToolStats(state.toolLevel);
  const bonus = getBonuses();
  const effPower = Math.round(tool.power * bonus.speedMult);

  document.getElementById('goldDisplay').textContent = `${Math.floor(state.gold).toLocaleString()} G`;
  document.getElementById('incomeDisplay').textContent = `박물관 +${getPassiveIncomePerSec().toLocaleString()} G/초`;
  document.getElementById('toolIcon').textContent = tool.icon;
  document.getElementById('toolName').textContent = `${tool.name} Lv.${tool.lv}`;
  document.getElementById('toolDesc').textContent = `연마력 ${effPower} | 범위 ${Math.round(tool.radius)}px`;
  document.getElementById('upgradeCost').textContent = `${tool.cost.toLocaleString()} G`;
  document.getElementById('upgradeBtn').disabled = state.gold < tool.cost;
}

function renderMuseum() {
  const list = document.getElementById('museumList');
  list.innerHTML = '';
  let ownedKinds = 0;

  THEMES.forEach(t => {
    const complete = t.items.every(it => (state.owned[it.id] || 0) > 0);
    const sec = document.createElement('div');
    sec.className = 'theme-section';
    sec.innerHTML = `
      <div class="theme-header">
        <span class="theme-title">${t.name}</span>
        <span class="theme-bonus ${complete ? 'unlocked' : ''}">${complete ? '활성화: ' : ''}${t.bonusLabel}</span>
      </div>
      <div class="relic-grid">
        ${t.items.map(it => {
          const cnt = state.owned[it.id] || 0;
          if (cnt > 0) ownedKinds++;
          return `
            <div class="relic-slot ${cnt > 0 ? 'owned' : ''}">
              <div class="relic-emoji">${it.emoji}</div>
              <div class="relic-name">${cnt > 0 ? `${it.name} (x${cnt})` : '???'}</div>
              <div class="relic-income">${cnt > 0 ? `+${it.income} G/초` : '미발굴'}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    list.appendChild(sec);
  });

  const speedPct = Math.round((getBonuses().speedMult - 1) * 100);
  document.getElementById('collectedCount').textContent = `${ownedKinds} / ${ALL_ITEMS.length}`;
  document.getElementById('bonusSpeedText').textContent = `+${speedPct}%`;
}

document.getElementById('upgradeBtn').addEventListener('click', () => {
  const tool = getToolStats(state.toolLevel);
  if (state.gold >= tool.cost) {
    state.gold -= tool.cost;
    state.toolLevel += 1;
    saveState();
    updateHeaderUI();
  }
});

document.getElementById('modalCloseBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
  if (isCompleted) initStage();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('모든 진행 데이터와 골드를 초기화할까요?')) {
    localStorage.removeItem(STORAGE_KEY);
    state = { gold: 0, stage: 1, toolLevel: 1, owned: {}, lastSaveTime: Date.now() };
    updateHeaderUI();
    renderMuseum();
    initStage();
  }
});

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
    document.getElementById('mainScroll').scrollTop = 0;
  });
});

setInterval(() => {
  const inc = getPassiveIncomePerSec();
  if (inc > 0) {
    state.gold += inc;
    updateHeaderUI();
    saveState();
  }
}, 1000);

loadState();
const elapsedSec = Math.min(3600 * 8, Math.floor((Date.now() - state.lastSaveTime) / 1000));
const offlineEarn = elapsedSec * getPassiveIncomePerSec();
if (offlineEarn > 0 && elapsedSec >= 10) {
  state.gold += offlineEarn;
  setTimeout(() => {
    document.getElementById('modalSubtitle').textContent = '박물관 오프라인 정산';
    document.getElementById('modalEmoji').textContent = '🏛️';
    document.getElementById('modalTitle').textContent = `+${offlineEarn.toLocaleString()} G 획득!`;
    document.getElementById('modalDesc').textContent = `자리를 비운 ${elapsedSec}초 동안 관람객 입장료가 쌓였습니다.`;
    document.getElementById('modalOverlay').classList.add('show');
  }, 300);
}

updateHeaderUI();
renderMuseum();
initStage();
draw();
</script>
</body>
</html>
