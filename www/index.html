<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f1c26" />
<title>5초 유물 발굴 & 박물관 타이쿤</title>
<style>
  :root {
    --bg-dark: #131118;
    --panel: #1e1b26;
    --panel-light: #2a2636;
    --accent: #f5b942;
    --accent-blue: #38bdf8;
    --accent-red: #f87171;
    --accent-green: #4ade80;
    --text-main: #f4f1ea;
    --text-sub: #a39eb0;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0a0e;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  #app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    background: var(--panel);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #322d3d;
    gap: 8px;
    flex-shrink: 0;
  }

  .stat-box { display: flex; flex-direction: column; }
  .stat-label { font-size: 11px; color: var(--text-sub); }
  .stat-val { font-size: 18px; font-weight: 800; color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .passive-badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent-blue);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }

  .btn-reset {
    background: #2b2735;
    color: #a39eb0;
    border: 1px solid #3d374a;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    touch-action: pan-y;
  }

  .tab-view { display: none; }
  .tab-view.active { display: block; padding-bottom: 24px; }

  #tab-dig.active {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-bottom: 0;
  }

  /* 발굴 상단 정보 & 타이머 */
  .dig-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stage-pill {
    background: var(--panel-light);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
  }

  .stage-pill span { color: var(--accent); }

  .relic-target-info {
    font-size: 12px;
    color: var(--text-sub);
    background: #1a1722;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #2e2938;
  }

  .timer-box {
    background: var(--panel);
    border: 1px solid #332e40;
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }

  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .timer-label { font-size: 12px; color: var(--text-sub); font-weight: 600; }
  .timer-val { font-size: 18px; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; }
  .timer-val.urgent { color: var(--accent-red); animation: pulse 0.4s infinite alternate; }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  .timer-bar-bg {
    width: 100%;
    height: 10px;
    background: #141218;
    border-radius: 99px;
    overflow: hidden;
  }

  .timer-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4ade80, #facc15);
    transition: width 0.05s linear;
  }

  /* 발굴 격자 보드 */
  .board-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }

  .dig-board {
    position: relative;
    width: 100%;
    max-width: 350px;
    aspect-ratio: 1 / 1;
    background: #18151f;
    border: 3px solid #353042;
    border-radius: 18px;
    padding: 8px;
    display: grid;
    gap: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    touch-action: manipulation;
  }

  /* 유물 레이어 (타일 아래 깔림) */
  .relic-layer {
    position: absolute;
    inset: 8px;
    display: grid;
    gap: 6px;
    pointer-events: none;
    z-index: 1;
  }

  .relic-item-box {
    background: radial-gradient(circle, rgba(245,185,66,0.28) 0%, rgba(245,185,66,0.08) 100%);
    border: 2px dashed rgba(245, 185, 66, 0.55);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .relic-item-box.found {
    background: radial-gradient(circle, rgba(250,204,21,0.45) 0%, rgba(245,158,11,0.2) 100%);
    border: 2px solid #fde047;
    box-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
    animation: foundPop 0.35s ease-out;
  }

  @keyframes foundPop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .relic-size-badge {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 10px;
    font-weight: 800;
    background: rgba(0,0,0,0.65);
    color: #fde047;
    padding: 1px 5px;
    border-radius: 5px;
  }

  /* 돌 블록 레이어 */
  .tile-layer {
    position: relative;
    z-index: 2;
    display: grid;
    gap: 6px;
    width: 100%;
    height: 100%;
  }

  .rock-tile {
    background: linear-gradient(145deg, #574b42, #3d342e);
    border: 2px solid #6e5f54;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.06s ease, opacity 0.15s ease;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.35);
    touch-action: manipulation;
  }

  .rock-tile:active {
    transform: scale(0.92);
  }

  .rock-tile.damaged {
    background: linear-gradient(145deg, #463c35, #2f2823);
    border-style: dashed;
  }

  /* 유물이 아래에 있을 때 금 간 틈새에서 황금빛이 비침 */
  .rock-tile.gold-peek {
    border-color: #f5b942;
    box-shadow: inset 0 0 12px rgba(245, 185, 66, 0.55);
  }

  /* 특성 힌트 타일 */
  .rock-tile.hint-glow {
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.7), inset 0 0 10px rgba(56, 189, 248, 0.4);
  }

  .rock-tile.broken {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.7);
  }

  .tile-hp {
    font-size: 12px;
    font-weight: 800;
    color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.35);
    padding: 2px 7px;
    border-radius: 99px;
  }

  .dig-footer-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 10px;
    margin-bottom: 4px;
  }

  /* 특성(업그레이드) 탭 */
  .section-title {
    font-size: 15px;
    font-weight: 800;
    margin: 0 0 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .trait-card {
    background: var(--panel);
    border: 1px solid #322d3d;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .trait-info h4 {
    margin: 0 0 4px 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trait-lv {
    font-size: 11px;
    background: rgba(245, 185, 66, 0.18);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 6px;
  }

  .trait-info p {
    margin: 0;
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.4;
  }

  .btn-buy {
    background: var(--accent);
    color: #16131c;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 800;
    font-size: 12px;
    min-width: 96px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .btn-buy:disabled {
    background: #332e40;
    color: #777185;
    cursor: not-allowed;
  }

  /* 박물관 탭 */
  .museum-top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 11px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #322d3d;
  }

  .btn-auto-equip {
    background: rgba(56, 189, 248, 0.2);
    color: var(--accent-blue);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .hall-card {
    background: var(--panel);
    border: 1px solid #353042;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .hall-card.locked {
    background: #17141f;
    border-style: dashed;
    text-align: center;
    padding: 18px 12px;
  }

  .hall-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .hall-name { font-weight: 800; font-size: 14px; }
  .hall-income { font-size: 12px; color: var(--accent-blue); font-weight: 700; }

  .display-slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .display-slot {
    background: #141218;
    border: 1.5px dashed #3d374d;
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .display-slot.filled {
    border-style: solid;
    border-color: #5b5173;
    background: #231f2e;
  }

  .slot-emoji { font-size: 24px; }
  .slot-name { font-size: 10px; color: var(--text-main); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .slot-rate { font-size: 10px; color: var(--accent); font-weight: 700; }

  /* 보유 유물 보관함 */
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }

  .inv-item {
    background: var(--panel);
    border: 1px solid #322d3d;
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
  }

  .inv-item.equipped {
    border-color: var(--accent-green);
    background: rgba(74, 222, 128, 0.08);
  }

  /* 하단 탭 네비게이션 */
  nav {
    display: flex;
    background: var(--panel);
    border-top: 1px solid #322d3d;
    flex-shrink: 0;
  }

  nav button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-sub);
    padding: 13px 0;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  nav button.active {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  /* 정산 및 선택 모달 */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 18px;
    z-index: 60;
  }

  .modal-overlay.show { display: flex; }

  .modal-card {
    background: var(--panel);
    border: 1px solid #484059;
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    max-width: 350px;
    max-height: 80dvh;
    overflow-y: auto;
    text-align: center;
  }

  .settle-list {
    background: #141218;
    border-radius: 12px;
    padding: 10px;
    margin: 12px 0;
    text-align: left;
  }

  .settle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #252130;
    font-size: 13px;
  }

  .settle-row:last-child { border-bottom: none; }

  .modal-btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #16131c;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-btn.secondary {
    background: #2e293b;
    color: var(--text-main);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat-box">
      <span class="stat-label">보유 골드</span>
      <span class="stat-val" id="goldDisplay">0 G</span>
    </div>
    <div class="header-right">
      <div class="passive-badge" id="incomeDisplay">박물관 +0 G/초</div>
      <button class="btn-reset" id="resetBtn">초기화</button>
    </div>
  </header>

  <main id="mainScroll">
    <!-- 1. 발굴 탭 -->
    <section id="tab-dig" class="tab-view active">
      <div class="dig-top-bar">
        <div class="stage-pill">STAGE <span id="stageNumText">1</span> (<span id="gridSizeText">3×3</span>)</div>
        <div class="relic-target-info" id="targetRelicHint">매장 유물: 1개</div>
      </div>

      <div class="timer-box">
        <div class="timer-row">
          <span class="timer-label" id="timerStatusText">블록을 두드리면 타이머가 시작됩니다!</span>
          <span class="timer-val" id="timerText">5.0초</span>
        </div>
        <div class="timer-bar-bg">
          <div class="timer-bar-fill" id="timerFill"></div>
        </div>
      </div>

      <div class="board-container">
        <div class="dig-board" id="digBoard">
          <div class="relic-layer" id="relicLayer"></div>
          <div class="tile-layer" id="tileLayer"></div>
        </div>
      </div>

      <div class="dig-footer-hint" id="digSubHint">2칸·4칸 대형 유물은 덮인 칸을 모두 깨야 획득합니다!</div>
    </section>

    <!-- 2. 특성(업그레이드) 탭 -->
    <section id="tab-traits" class="tab-view">
      <h3 class="section-title">⚡ 발굴 & 감정 특성 강화</h3>
      <div id="traitsContainer"></div>
    </section>

    <!-- 3. 박물관 탭 -->
    <section id="tab-museum" class="tab-view">
      <div class="museum-top-actions">
        <div>
          <div style="font-size:13px; font-weight:800;">🏛️ 전시실 관리 (칸당 최대 4개)</div>
          <div style="font-size:11px; color:#a39eb0;">슬롯을 터치해 유물을 배치하거나 교체하세요</div>
        </div>
        <button class="btn-auto-equip" id="autoEquipBtn">최고 수익 자동배치</button>
      </div>

      <div id="hallsContainer"></div>

      <h3 class="section-title" style="margin-top:16px;">
        <span>🎒 발굴한 유물 보관함</span>
        <span style="font-size:12px; color:#a39eb0;" id="invCountText">0종 보유</span>
      </h3>
      <div class="inv-grid" id="inventoryContainer"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-target="tab-dig">⛏️ 유물 발굴</button>
    <button data-target="tab-traits">⚡ 특성 강화</button>
    <button data-target="tab-museum">🏛️ 박물관</button>
  </nav>

  <!-- 정산 & 슬롯 선택 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalContent"></div>
  </div>
</div>

<script>
/**
 * 1. 유물 도감 데이터 (1칸 / 2칸 / 4칸 크기별 유물)
 */
const RELIC_DB = [
  // 1칸짜리 유물 (1x1)
  { id: 'r1_coin', name: '고대 엽전', emoji: '🪙', w: 1, h: 1, basePrice: 120, income: 3, minStage: 1 },
  { id: 'r1_pot', name: '청자 찻잔', emoji: '🍵', w: 1, h: 1, basePrice: 160, income: 4, minStage: 1 },
  { id: 'r1_ring', name: '루비 반지', emoji: '💍', w: 1, h: 1, basePrice: 230, income: 6, minStage: 1 },
  { id: 'r1_can', name: '찌그러진 캔(가품)', emoji: '🥫', w: 1, h: 1, basePrice: 45, income: 1, minStage: 1 },

  // 2칸짜리 유물 (2x1 또는 1x2)
  { id: 'r2_sword', name: '청동 단검', emoji: '🗡️', w: 2, h: 1, basePrice: 380, income: 11, minStage: 1 },
  { id: 'r2_scroll', name: '황금 두루마리', emoji: '📜', w: 1, h: 2, basePrice: 450, income: 14, minStage: 2 },
  { id: 'r2_harp', name: '고대 수금', emoji: '🪕', w: 2, h: 1, basePrice: 560, income: 18, minStage: 2 },

  // 4칸짜리 대형 유물 (2x2) - 중반 스테이지부터 등장
  { id: 'r4_crown', name: '신라 황금관', emoji: '👑', w: 2, h: 2, basePrice: 1350, income: 45, minStage: 3 },
  { id: 'r4_statue', name: '파라오 황금상', emoji: '🗿', w: 2, h: 2, basePrice: 1800, income: 62, minStage: 4 },
  { id: 'r4_dragon', name: '전설의 옥새함', emoji: '🐉', w: 2, h: 2, basePrice: 2500, income: 88, minStage: 5 }
];

const HALL_UNLOCK_COSTS = [0, 1200, 6500, 28000, 120000];

/**
 * 2. 게임 상태 저장/불러오기
 */
const STORAGE_KEY = 'dig5sec_tycoon_v1';
let state = {
  gold: 0,
  stage: 1,
  traits: {
    time: 0,      // +0.5초씩 증가
    power: 0,     // 타격력 +1씩 증가
    hint: 0,      // 시작 시 유물 칸 힌트 개수
    price: 0,     // 유물 가격 +10%씩 증가
    luck: 0       // 대형(2칸/4칸) 유물 등장 확률 증가
  },
  inventory: {},  // { relicId: count }
  halls: [
    [null, null, null, null] // 제1전시실 기본 오픈 (4칸)
  ],
  lastSaveTime: Date.now()
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = {
        ...state,
        ...parsed,
        traits: { ...state.traits, ...(parsed.traits || {}) }
      };
    }
  } catch (e) {}
}

function saveState() {
  state.lastSaveTime = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/**
 * 3. 효과음 합성 (Web Audio API)
 */
let audioCtx = null;
function playTone(freq, type = 'triangle', duration = 0.07, vol = 0.06) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

/**

function getMaxDigTime() {
  return 5.0 + state.traits.time * 0.5;
}

function getTapPower() {
  return 1 + state.traits.power;
}

function getPriceMultiplier() {
  return 1 + state.traits.price * 0.10;
}

function getHallIncome(hallSlots) {
  let sum = 0;
  let filledCount = 0;
  hallSlots.forEach(rid => {
    if (rid) {
      const item = RELIC_DB.find(r => r.id === rid);
      if (item) {
        sum += item.income;
        filledCount++;
      }
    }
  });
  // 전시실 4칸 꽉 채우면 세트 보너스 +25%
  if (filledCount === 4) sum = Math.round(sum * 1.25);
  return sum;
}

function getTotalPassiveIncome() {
  return state.halls.reduce((acc, hall) => acc + getHallIncome(hall), 0);
}

/**
 * 5. 발굴 스테이지 생성 및 진행 로직
 */
let gridCols = 3;
let tiles = [];          // { r, c, hp, maxHp, relicIdx, isHint }
let placedRelics = [];   // { relic, r, c, w, h, cells: [[r,c]...], found }
let timeLeft = 5.0;
let timerRunning = false;
let roundEnded = false;
let timerInterval = null;

function getGridSizeForStage(st) {
  if (st >= 8) return 5; // 5x5 (25칸)
  if (st >= 4) return 4; // 4x4 (16칸)
  return 3;              // 3x3 (9칸)
}

function getBlockMaxHpForStage(st) {
  if (st >= 9) return 4;
  if (st >= 5) return 3;
  return 2; // 처음에는 2번 두드려서 깨짐
}

function setupStage() {
  clearInterval(timerInterval);
  timerRunning = false;
  roundEnded = false;
  timeLeft = getMaxDigTime();

  gridCols = getGridSizeForStage(state.stage);
  const blockHp = getBlockMaxHpForStage(state.stage);

  // 격자 초기화
  tiles = [];
  for (let r = 0; r < gridCols; r++) {
    for (let c = 0; c < gridCols; c++) {
      tiles.push({ r, c, hp: blockHp, maxHp: blockHp, relicIdx: -1, isHint: false });
    }
  }

  // 스테이지별 매장 유물 수 결정 (3x3은 1개, 4x4는 1~2개, 5x5는 2~3개)
  const targetCount = gridCols === 3 ? 1 : (gridCols === 4 ? (Math.random() < 0.55 ? 2 : 1) : (Math.random() < 0.6 ? 3 : 2));
  placedRelics = [];

  for (let i = 0; i < targetCount; i++) {
    const relic = chooseRelicForStage(state.stage);
    const placed = tryPlaceRelic(relic, placedRelics.length);
    if (!placed) {
      // 큰 유물 자리가 없으면 1칸 유물로 대체 배치
      const fallback = RELIC_DB.filter(r => r.w === 1 && r.h === 1)[Math.floor(Math.random() * 4)];
      tryPlaceRelic(fallback, placedRelics.length);
    }
  }

  // 힌트 특성 적용 (유물이 묻힌 타일 중 랜덤으로 hint 레벨만큼 표시)
  const relicTiles = tiles.filter(t => t.relicIdx !== -1);
  shuffleArray(relicTiles);
  const hintCount = Math.min(state.traits.hint, relicTiles.length);
  for (let i = 0; i < hintCount; i++) {
    relicTiles[i].isHint = true;
  }

  // UI 갱신
  document.getElementById('stageNumText').textContent = state.stage;
  document.getElementById('gridSizeText').textContent = `${gridCols}×${gridCols}`;
  document.getElementById('targetRelicHint').textContent = `매장 유물: ${placedRelics.length}개 (내구도 ${blockHp})`;
  document.getElementById('timerStatusText').textContent = '블록을 두드리면 타이머가 시작됩니다!';
  updateTimerUI();
  renderBoard();
}

function chooseRelicForStage(st) {
  const candidates = RELIC_DB.filter(r => r.minStage <= st);
  const luckBonus = state.traits.luck * 0.12;
  const weighted = candidates.map(r => {
    const size = r.w * r.h;
    let weight = size === 1 ? 10 : (size === 2 ? 5 * (1 + luckBonus) : 3.5 * (1 + luckBonus * 1.4));
    if (r.id === 'r1_can') weight = Math.max(1.5, 4 - state.traits.luck * 0.3);
    return { item: r, weight };
  });
  const totalW = weighted.reduce((s, x) => s + x.weight, 0);
  let pick = Math.random() * totalW;
  for (const w of weighted) {
    pick -= w.weight;
    if (pick <= 0) return w.item;
  }
  return candidates[0];
}
